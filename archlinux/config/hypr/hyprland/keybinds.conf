###################
### KEYBINDINGS ### --- Atalhos
###################

# --- Keybindings Variables ---
$mainMod = SUPER # Sets "Windows" key as main modifier

# --- Hyprland Binds --- See https://wiki.hypr.land/Configuring/Binds/ for more
bind = $mainMod, Q, exec, $terminal
bind = $mainMod, C, killactive
bind = $mainMod, M, exit
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, F, togglefloating
bind = $mainMod, Space, exec, $menu # menu de aplicativos
bind = $mainMod, P, pseudo, # dwindle
bind = $mainMod, J, layoutmsg, togglesplit # dwindle
bind = $mainMod, L, exec, hyprlockL
bind = $mainMod, ENTER, fullscreen

# --- Windows Focus (ALT, TAB) ---
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d
bind = $mainMod, Tab, movefocus, next

# --- Switch Workspaces ---
bind = SHIFT+Alt, 1, workspace, 1
bind = SHIFT+Alt, 2, workspace, 2
bind = SHIFT+Alt, 3, workspace, 3
bind = SHIFT+Alt, 4, workspace, 4
bind = SHIFT+Alt, 5, workspace, 5
bind = SHIFT+Alt, 6, workspace, 6
bind = SHIFT+Alt, 7, workspace, 7
bind = SHIFT+Alt, 8, workspace, 8
bind = SHIFT+Alt, 9, workspace, 9
bind = SHIFT+Alt, 0, workspace, 10

# --- Move Windows For Another Workspace ---
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# --- Special Workspace (scratchpad) ---
# bind = $mainMod, S, togglespecialworkspace, magic
# bind = $mainMod SHIFT, S, movetoworkspace, special:magic

# --- Switch Workspace Using mouse Scroll ---
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# --- Move/Resize Windows ---
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# --- Keys for AUDIO and BRIGHTHNESS (Can change %) ---
binde = ,XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 2%+ # Aumentar volume (2%)
binde = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 2%- # Diminuir volume (2%)
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle # Mute (mutar o pc)
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle # Mute microfone
bindel = ,XF86MonBrightnessUp, exec, brightnessctl -e4 -n2 set 5%+ # Brilho +
bindel = ,XF86MonBrightnessDown, exec, brightnessctl -e4 -n2 set 5%- # Brilho -

bindl = , XF86AudioNext, exec, playerctl next # Próxima música
bindl = , XF86AudioPause, exec, playerctl play-pause # Pause
bindl = , XF86AudioPlay, exec, playerctl play-pause # Play
bindl = , XF86AudioPrev, exec, playerctl previous # Música anterior

# --- Customized Keybinds ---
bind = $mainMod, v, exec, ~/.config/rofi/cliphist/clip.sh # Atalho para o cliphist
bind = $mainMod SHIFT, S, exec, grim -g "$(slurp)" - | wl-copy # Seleção de Print

bind = ALT SHIFT, Return, exec, $HOME/.config/swww_wallpapers/next-wallpaper.sh # Troca o wallpaper atual utilizando o launcher que criamos do SWWW

bind = $mainMod, period, exec, rofi -show emoji -theme ~/.config/rofi/emojis/theme.rasi  # Mostra o menu de emoji clicando SUPER .

bind = ALT SHIFT, f4, exec, ~/.config/os_themes/selector/selector.sh # Abre o menu de troca de temas