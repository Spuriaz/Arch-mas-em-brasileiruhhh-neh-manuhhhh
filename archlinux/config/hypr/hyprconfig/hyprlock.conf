# --- Explicação Rápida (PT-BR) ---

# Haling = Horinzontal aligment / Pode se usar: left, center, right
# Valing = Vertical aligment / Pode se usar: top, center, bottom

# Exemplo envolvendo posição:
# haling = center
# valing = center
# position = -470, 320

# Basicamente ele diz: "comece do centro da tela, tanto verticalmente quanto horizontalmente, depois mova -470 no eixo X e 320 no eixo Y".
# Usando haling e valing no centro, ele move -470 pra X A PARTIR DO CENTRO.
# Se fosse haling = left (esquerda) e valing = top, com posição -470, 320, ele COMEÇARIA a se mover -470 pro eixo X >A PARTIR< do canto superior esquerdo da tela.

# Resumo:
# Haling/valing = São pontos de referência.
# Position = deslocamento a partir desse ponto.

# Sobre os textos:
# text = cmd[update:1000] echo "<span>$(date +"%I:%M")</span>"
# Cmd significa "comando", e o comando utilizado é para atualizar a cada 1000ms (1 segundo).
# Echo é um print, ele printa a data atual com horas e minutos.




# --- Geral ---
general {
    no_fade_in = false
    disable_loading_bar = false
    grace = 0 # Tempo antes de aceitar a senha
}

# --- Background ---
background {
    monitor = # Vazio = todos os monitores
    path = /home/spuria/Wallpapers/osascokkkkk.png # Background
    blur_passes = 1 # Blur do background
    contrast = 1 # Contraste do fundo
    # brightness = 0.8
    # ibrancy = 0.1696
    # vibrancy_darkness = 0.0
}




# --- Entrance ---
label {
    monitor = # Vazio = todos os monitores
    text = Session # Texto do topo
    color = rgb(205, 214, 244) # Cor do texto
    font_size = 55 # Tamanho da fonte
    font_family = JetBrainsMono Nerd Font # Fonte
    position = -470, 320 # Posição
    halign = center # Haling = Horizontal aligment
    valign = center # Valing = Vertical aligment
}

# --- Time ---
label {
    monitor = # Vazio = todos os monitores
    text = cmd[update:1000] echo "<span>$(date +"%I:%M")</span>" # Horário
    color = rgb(205, 214, 244) # Cor
    font_size = 40 # Tamanho da fonte
    font_family = JetBrainsMono Nerd Font # Fonte
    position = -470, 240 # Posição
    halign = center # Haling = Horizontal aligment
    valign = center # Valing = Vertical aligment
}

# --- Date ---
label {
    monitor = # Vazio = todos os monitores
    text = cmd[update:1000] echo "$(date +"%A, %B %d")" # Dia atual
    color = rgba(205, 214, 224, .75) # Cor
    font_size = 20 # Tamanho da fonte
    text_align = left # Alinhamento do texto
    font_family = JetBrainsMono Nerd Font # Fonte
    position = 85, 175 # Posição
    halign = left # Haling = Horizontal aligment
    valign = center # Valing = Vertical aligment
}




# --- Profile ---
image {
    monitor = # Vazio = todos os monitores
    path = /home/spuria/Profile_pictures/seacat.jpg # Imagem do perfil
    border_size = 3 # Tamanho da borda
    border_color = rgba(137, 180, 250, .75) # Cor da borda
    size = 160 # Tamanho da imagem
    rounding = -1 # Borda totalmente arredondada (circulo perfeito) / 0 = Cantos quadrados, 10 = cantos arredondados, -1 = circulo perfeito
    rotate = 0 # Rotação do elemento em graus / 0 = normal, 90 = girado, 180 = de cabeça pra baixo
    position = -470, 25 # Posição
    halign = center # Haling = Horizontal aligment
    valign = center # Valing = Vertical aligment
}

# --- User ---
label {
    monitor = # Vazio = todos os monitores
    text =  $USER # Nosso nome de usuário
    color = rgb(186, 194, 222)
    font_size = 16 # Tamanho da fonte
    font_family = JetBrainsMono Nerd Font # Fonte
    position =-470, -140 # Posição
    halign = center # Haling = Horizontal aligment
    valign = center # Valing = Vertical aligment
}

# --- User Box ---
shape {
    monitor = # Vazio = todos os monitores
    size = 320, 55 # Tamanho da caixa do input
    color = rgba(88, 91, 112, 0.4) # Cor da caixa
    rounding = -1 # Borda totalmente arredondada (circulo perfeito) / 0 = Cantos quadrados, 10 = cantos arredondados, -1 = circulo perfeito
    border_size = 0 # Tamanho da borda
    border_color = rgb(255, 255, 255) # Cor da borda
    rotate = 0 # Rotação do elemento em graus / 0 = normal, 90 = girado, 180 = de cabeça pra baixo
    position = -470, -140 # Posição
    halign = center # Haling = Horizontal aligment
    valign = center # Valing = Vertical aligment
}




# --- Input Field ---
input-field {
    monitor = # Vazio = todos os monitores
    size = 320, 55 # Tamanho do campo de input
    dots_size = 0.2 # Tamanho das bolinhas da senha do input
    dots_spacing = 0.2 # Espaçamento entre as bolinhas
    dots_center = true # Posição das bolinhas no input (nesse caso, centralizadas)
    outer_color = rgba(255, 255, 255, 0) # Cor da borda do input
    inner_color = rgba(88, 91, 112, 0.4) # Cor do background do input
    font_color = rgb(205, 214, 244) # Cor das bolinhas
    fade_on_empty = false # O input deve aparecer apenas quando começar a digitar
    font_family = JetBrainsMono Nerd Font # Fonte
    placeholder_text = <i><span foreground="##bac2de">🔒 Enter Pass</span></i> # Placeholder para digitar a senha
    hide_input = false # Esconder o input (se true, não é possível ver a senha ser digitada)
    position = -470, -220 # Posição
    halign = center # Haling = Horizontal aligment
    valign = center # Valing = Vertical aligment
}